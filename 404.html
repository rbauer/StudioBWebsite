<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Studio B LLC</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&amp;display=swap" rel="stylesheet">
<!-- Self-contained on purpose: GitHub Pages serves this file at any depth, so relative asset paths would break. -->
<style>
  :root{--bg:#F7F5FF;--ink:#15112B;--mut:#686384;--line:rgba(21,17,43,.09);--violet:#6D4DF6;
    --grad:linear-gradient(120deg,#6D4DF6 0%,#B04DF0 45%,#FF6B4A 100%);--spring:cubic-bezier(.34,1.56,.64,1)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100svh;display:grid;place-items:center;background:var(--bg);color:var(--ink);overflow:hidden;
    font:500 17px/1.6 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;padding:24px}
  .blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:.5;z-index:-1}
  .b1{width:480px;height:480px;background:#B7A8FF;top:-140px;right:-80px}
  .b2{width:380px;height:380px;background:#FFC1B0;bottom:-140px;left:-60px}
  main{text-align:center;max-width:560px}
  .code{font-weight:800;font-size:clamp(6rem,24vw,11rem);line-height:.9;letter-spacing:-.06em;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  h1{font-weight:800;font-size:clamp(1.6rem,4vw,2.2rem);letter-spacing:-.03em;margin-top:18px;line-height:1.15}
  p{color:var(--mut);margin-top:12px}
  .ctas{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:30px}
  a{display:inline-flex;align-items:center;height:52px;padding:0 24px;border-radius:16px;font-weight:700;text-decoration:none;transition:transform .3s var(--spring)}
  a:hover{transform:translateY(-3px)}
  .primary{background:var(--violet);color:#fff;box-shadow:0 14px 30px -12px rgba(109,77,246,.7)}
  .soft{background:#fff;color:var(--ink);border:1px solid var(--line)}
  a:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
</style>
</head>
<body>
  <div class="blob b1" aria-hidden="true"></div><div class="blob b2" aria-hidden="true"></div>
  <main>
    <div class="code" aria-hidden="true">404</div>
    <h1>This page hasn't shipped.</h1>
    <p>The page you're looking for doesn't exist, or it's moved. Let's get you back somewhere useful.</p>
    <div class="ctas">
      <a class="primary" href="/">Back to home</a>
      <a class="soft" href="mailto:contact@studiob.llc">Contact us</a>
    </div>
  </main>
</body>
</html>
